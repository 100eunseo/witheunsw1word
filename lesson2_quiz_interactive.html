<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Witheun | Lesson 2 단어 시험 by. 은서쌤</title> <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"> <style> :root { --bg: #f7f6f2; --surface: #ffffff; --ink: #0f0e0b; --ink2: #4a4840; --ink3: #9a9690; --accent: #e8400c; --accent2: #1a6b3c; --accent3: #1a3f8c; --correct: #1a6b3c; --wrong: #c0200a; --border: #d8d4cc; --mono: 'IBM Plex Mono', monospace; --sans: 'Noto Sans KR', sans-serif; } * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: var(--sans); background: var(--bg); color: var(--ink); min-height: 100vh; } /* ── BRAND HEADER ── */ .brand-header { background: var(--ink); color: #fff; text-align: center; padding: 18px 24px 14px; border-bottom: 3px solid var(--accent); } .brand-title { font-family: var(--mono); font-size: 28px; font-weight: 600; letter-spacing: 0.08em; color: #fff; display: block; margin-bottom: 4px; } .brand-title span { color: #f5a623; } .brand-sub { font-family: var(--sans); font-size: 13px; color: #aaa; letter-spacing: 0.05em; } /* ── TOP NAV ── */ .topnav { background: #1a1917; color: #fff; padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 20px; position: sticky; top: 0; z-index: 200; } .topnav-logo { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.05em; color: #fff; flex-shrink: 0; } .topnav-logo span { color: #f5a623; } .topnav-sep { width: 1px; height: 20px; background: #333; flex-shrink: 0; } .type-toggles { display: flex; gap: 6px; } .tgl { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 3px; border: 1.5px solid #444; background: transparent; color: #666; cursor: pointer; transition: all 0.12s; letter-spacing: 0.03em; } .tgl.on { background: #fff; color: var(--ink); border-color: #fff; } .topnav-actions { display: flex; gap: 8px; margin-left: auto; } .nav-btn { font-family: var(--sans); font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 4px; border: none; cursor: pointer; transition: all 0.12s; white-space: nowrap; } .nav-btn.primary { background: var(--accent); color: #fff; } .nav-btn.primary:hover { background: #c73309; } .nav-btn.ghost { background: transparent; border: 1.5px solid #444; color: #aaa; } .nav-btn.ghost:hover { border-color: #aaa; color: #fff; } .nav-btn.green { background: var(--accent2); color: #fff; } .nav-btn.green:hover { background: #155c33; } /* ── MAIN LAYOUT ── */ .layout { display: grid; grid-template-columns: 1fr 300px; gap: 0; min-height: calc(100vh - 52px); } /* ── QUIZ PANEL ── */ .quiz-panel { padding: 28px 32px; max-width: 720px; } .quiz-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); } .quiz-title { font-size: 18px; font-weight: 700; } .quiz-count { font-family: var(--mono); font-size: 12px; color: var(--ink3); background: var(--border); padding: 3px 8px; border-radius: 3px; } /* ── QUESTIONS ── */ .question { margin-bottom: 0; padding: 20px 0; border-bottom: 1px solid var(--border); animation: fadeIn 0.2s ease; } @keyframes fadeIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:none; } } .question:last-child { border-bottom: none; } .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; } .q-num { font-family: var(--mono); font-size: 11px; font-weight: 600; width: 24px; height: 24px; background: var(--ink); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; } .q-badge { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 2px; letter-spacing: 0.04em; } .b1 { background: #dde8ff; color: #1a3f8c; } .b2 { background: #d8f5e4; color: #1a6b3c; } .b3 { background: #fde8e0; color: #b83300; } .b4 { background: #ede0ff; color: #6b1aaa; } .q-label { font-size: 13px; color: var(--ink2); font-weight: 500; } .q-copyright { font-family: var(--mono); font-size: 9px; color: var(--ink3); margin-left: auto; letter-spacing: 0.03em; flex-shrink: 0; } /* 단어 타겟 */ .target-word { font-family: var(--mono); font-size: 20px; font-weight: 600; margin: 8px 0 14px 32px; letter-spacing: 0.02em; color: var(--ink); } /* 선택지 (유형1,2,3) */ .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-left: 32px; } .choice-btn { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 5px; background: var(--surface); cursor: pointer; font-family: var(--sans); font-size: 13.5px; color: var(--ink); transition: all 0.1s; text-align: left; width: 100%; } .choice-btn:hover:not(:disabled) { border-color: var(--ink); background: var(--bg); } .choice-btn .c-num { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ink3); flex-shrink: 0; width: 18px; } .choice-btn.selected { border-color: var(--ink); background: #f0ede8; } .choice-btn.correct { border-color: var(--correct); background: #d8f5e4; color: var(--correct); } .choice-btn.correct .c-num { color: var(--correct); } .choice-btn.wrong { border-color: var(--wrong); background: #fde8e0; color: var(--wrong); } .choice-btn.wrong .c-num { color: var(--wrong); } .choice-btn:disabled { cursor: default; } /* 유형4 */ .type4-sentence { font-size: 14px; line-height: 1.9; margin: 6px 0 4px 32px; font-weight: 500; } .type4-korean { font-size: 12.5px; color: var(--ink2); margin: 0 0 12px 32px; line-height: 1.6; } .box-wrap { margin-left: 32px; margin-bottom: 10px; } .box-label { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink3); margin-bottom: 5px; } .word-box { border: 1.5px solid var(--ink); padding: 8px 14px; font-size: 13.5px; border-radius: 4px; background: var(--surface); display: inline-block; } .type4-input-row { display: flex; align-items: center; gap: 10px; margin-left: 32px; margin-top: 4px; } .type4-input { font-family: var(--mono); font-size: 14px; padding: 7px 12px; border: 1.5px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--ink); width: 180px; outline: none; transition: border-color 0.1s; } .type4-input:focus { border-color: var(--ink); } .type4-input.correct-input { border-color: var(--correct); background: #d8f5e4; color: var(--correct); } .type4-input.wrong-input { border-color: var(--wrong); background: #fde8e0; color: var(--wrong); } .type4-input:disabled { cursor: default; } .answer-reveal { font-family: var(--mono); font-size: 12px; color: var(--correct); font-weight: 600; display: none; } .answer-reveal.show { display: inline; } /* 결과 피드백 */ .q-feedback { margin: 8px 0 0 32px; font-size: 12px; font-weight: 600; display: none; } .q-feedback.show { display: block; } .q-feedback.ok { color: var(--correct); } .q-feedback.ng { color: var(--wrong); } /* 제출 버튼 */ .submit-row { margin: 28px 0 8px; display: flex; gap: 10px; flex-wrap: wrap; } .big-btn { font-family: var(--sans); font-size: 14px; font-weight: 700; padding: 12px 28px; border-radius: 5px; border: none; cursor: pointer; transition: all 0.12s; } .big-btn.submit { background: var(--ink); color: #fff; } .big-btn.submit:hover { background: #333; } .big-btn.submit:disabled { background: #bbb; cursor: default; } .big-btn.regen { background: var(--accent); color: #fff; } .big-btn.regen:hover { background: #c73309; } .big-btn.wrong-only { background: var(--surface); color: var(--wrong); border: 2px solid var(--wrong); } .big-btn.wrong-only:hover { background: #fde8e0; } /* ── 하단 저작권 ── */ .footer-copyright { margin-top: 32px; padding: 20px 0 8px; border-top: 1px solid var(--border); text-align: center; } .footer-copyright .fc-brand { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--ink); letter-spacing: 0.06em; margin-bottom: 4px; } .footer-copyright .fc-brand span { color: var(--accent); } .footer-copyright .fc-text { font-size: 11px; color: var(--ink3); } /* ── SIDEBAR ── */ .sidebar { border-left: 1px solid var(--border); background: var(--surface); padding: 24px 20px; position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; } .sidebar-section { margin-bottom: 28px; } .sidebar-title { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: var(--ink3); text-transform: uppercase; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); } /* 점수판 */ .score-board { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; } .score-card { background: var(--bg); border-radius: 5px; padding: 10px 12px; text-align: center; } .score-card .sc-num { font-family: var(--mono); font-size: 24px; font-weight: 600; display: block; line-height: 1; margin-bottom: 3px; } .score-card .sc-label { font-size: 11px; color: var(--ink3); } .score-card.total .sc-num { color: var(--ink); } .score-card.correct-card .sc-num { color: var(--correct); } .score-card.wrong-card .sc-num { color: var(--wrong); } .score-card.rate-card .sc-num { color: var(--accent3); } /* 진행 바 */ .progress-bar-wrap { background: var(--border); border-radius: 10px; height: 6px; margin-bottom: 6px; overflow: hidden; } .progress-bar { height: 100%; background: var(--correct); border-radius: 10px; transition: width 0.4s ease; } .progress-label { font-size: 11px; color: var(--ink3); text-align: right; } /* 오답 노트 */ .wrong-list { display: flex; flex-direction: column; gap: 6px; } .wrong-item { background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--wrong); border-radius: 4px; padding: 8px 10px; } .wrong-item .wi-word { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 2px; } .wrong-item .wi-type { font-size: 10px; color: var(--ink3); margin-bottom: 3px; font-family: var(--mono); } .wrong-item .wi-detail { font-size: 12px; color: var(--ink2); } .wrong-item .wi-mine { color: var(--wrong); font-weight: 600; } .wrong-item .wi-ans { color: var(--correct); font-weight: 600; } .empty-wrong { font-size: 12px; color: var(--ink3); text-align: center; padding: 20px 0; } /* 번호 맵 */ .q-map { display: flex; flex-wrap: wrap; gap: 4px; } .q-dot { font-family: var(--mono); font-size: 10px; width: 24px; height: 24px; border-radius: 3px; border: 1.5px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--ink3); cursor: pointer; transition: all 0.1s; } .q-dot:hover { border-color: var(--ink); color: var(--ink); } .q-dot.answered { background: var(--bg); border-color: #bbb; color: var(--ink2); } .q-dot.ok { background: #d8f5e4; border-color: var(--correct); color: var(--correct); } .q-dot.ng { background: #fde8e0; border-color: var(--wrong); color: var(--wrong); } /* 인쇄 */ @media print { .topnav, .brand-header, .sidebar, .submit-row { display: none !important; } .layout { grid-template-columns: 1fr; } .quiz-panel { max-width: 100%; padding: 16px; } .choice-btn { border-color: #ccc !important; background: #fff !important; color: #000 !important; } .type4-input { border-color: #ccc !important; background: #fff !important; color: #000 !important; } .q-feedback { display: none !important; } .answer-reveal { display: none !important; } .footer-copyright { display: block !important; } } @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .sidebar { display: none; } .choices { grid-template-columns: 1fr; } .brand-title { font-size: 22px; } } </style> </head> <body> <!-- BRAND HEADER --> <header class="brand-header"> <span class="brand-title">With<span>eun</span></span> <span class="brand-sub">by. 은서쌤</span> </header> <!-- TOP NAV --> <nav class="topnav"> <div class="topnav-logo">Lesson <span>2</span> QUIZ</div> <div class="topnav-sep"></div> <div class="type-toggles"> <but tById('wrong-only-btn').style.display = 'inline-flex'; } } function updateScore(correct, total) { const wrong = total - correct; const rate = total > 0 ? Math.round(correct/total*100) : 0; document.getElementById('sc-total').textContent = total; document.getElementById('sc-correct').textContent = correct; document.getElementById('sc-wrong').textContent = wrong; document.getElementById('sc-rate').textContent = rate + '%'; document.getElementById('prog-bar').style.width = rate + '%'; document.getElementById('prog-label').textContent = `${correct} / ${total} 정답`; } function resetScore() { ['sc-total','sc-correct','sc-wrong','sc-rate'].forEach(id => { document.getElementById(id).textContent = '—'; }); document.getElementById('prog-bar').style.width = '0%'; document.getElementById('prog-label').textContent = '채점 전'; document.getElementById('wrong-list').innerHTML = '<div class="empty-wrong">채점 후 오답이 표시됩니다.</div>'; } function renderWrongList() { const el = document.getElementById('wrong-list'); if (wrongWords.length === 0) { el.innerHTML = '<div class="empty-wrong">🎉 오답이 없습니다!</div>'; return; } el.innerHTML = wrongWords.map(w => ` <div class="wrong-item"> <div class="wi-type">유형${w.type} ${w.typeLabel}</div> <div class="wi-word">${w.word}</div> <div class="wi-detail"> 내 답: <span class="wi-mine">${w.mine}</span> &nbsp;→&nbsp; 정답: <span class="wi-ans">${w.answer}</span> </div> </div>`).join(''); } function updateDot(i, cls) { const dot = document.getElementById(`dot-${i}`); if (!dot) return; dot.className = 'q-dot ' + cls; } function scrollToQ(i) { const el = document.getElementById(`q-${i}`); if (el) el.scrollIntoView({behavior:'smooth', block:'center'}); } generate(); </script> </body> </html>
